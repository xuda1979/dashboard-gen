# Dashboard example with sidebar layout
title: Ops Console
layout: sidebar
description: Internal read-only operations dashboard.

theme:
  accent: "#0ea5e9"
  radius: "6px"

hero:
  - type: headline
    level: 1
    text: Ops Console
  - type: paragraph
    text: A read-only internal dashboard generated from a single YAML file.

nav:
  - { label: Overview, href: "#s-overview" }
  - { label: Metrics, href: "#s-metrics" }
  - { label: Releases, href: "#s-releases" }
  - { label: Runbook, href: "#s-runbook" }

sections:
  - title: Overview
    content:
      - type: paragraph
        text: Environments are reported by their last known state.

      - type: status
        title: Environment health
        items:
          - name: Production API
            state: healthy
            detail: p99 43ms over the last 10 minutes
          - name: Billing worker
            state: degraded
            detail: Queue lag 1.2 minutes
          - name: EU database primary
            state: down
            detail: Failover in progress
          - name: Search index
            state: maintenance
            detail: Reindex window until 23:00

      - type: toc
        label: On this page

  - title: Metrics
    content:
      - type: grid
        columns: 3
        items:
          - type: stat
            label: Requests / min
            value: 1180
            delta: { value: 12.4, tone: good }
            caption: Rolling 1h average
          - type: stat
            label: P99 latency
            value: 212
            suffix: ms
            delta: { value: -8, tone: good }
            caption: Down from 220 ms
          - type: stat
            label: Error rate
            value: 0.04
            suffix: "%"
            delta: { value: 0.01, tone: bad }
            progress: 38
            progressTone: danger
            caption: SLO budget 0.1%

      - type: chart
        kind: line
        title: Requests / minute
        caption: Requests per minute by environment (inline row data).
        data:
          - label: 09:00
            series: { prod: 820, staging: 210 }
          - label: 10:00
            series: { prod: 940, staging: 230 }
          - label: 11:00
            series: { prod: 1180, staging: 260 }
          - label: 12:00
            series: { prod: 1020, staging: 240 }

      - type: card
        title: P99 latency
        text: 212 ms
        intent: success
      - type: card
        title: Error rate
        text: 0.04%
        intent: success

  - title: Releases
    content:
      - type: table
        caption: Recent releases
        rows:
          - [Commit, Service, Status]
          - [f3a9c21, billing-worker, pending]
          - [b27e01f, api-gateway, deployed]
          - [9c4d7e0, auth-service, deployed]

      - type: stepper
        current: 2
        items:
          - Build and smoke-test the release candidate
          - Deploy to staging and verify health
          - Roll out to production at 2%
          - Monitor for 30 minutes before full traffic

  - title: Storage
    content:
      - type: chart
        kind: bar
        title: Storage used (GB) by team
        caption: Bar chart with inline data.
        data:
          - label: analytics
            series: { gb: 320 }
          - label: core
            series: { gb: 210 }
          - label: ml
            series: { gb: 480 }

  - title: Runbook
    content:
      - type: callout
        tone: warning
        title: Incident playbook
        text: Follow the ordered steps below — never skip the rollback check before announcing an incident.

      - type: steps
        items:
          - Assess blast radius and page the on-call engineer.
          - Freeze deploys and record the current release hash.
          - Roll back to the last known-good release and verify health.
          - Post the incident timeline to the ops channel.

      - type: divider

      - type: quote
        text: Production is the least interesting environment — until it is the only one.
        cite: Ops Handbook

      - type: divider

      - type: paragraph
        text: "Typical recovery commands for the billing-worker service:"

      - type: code
        title: Rollback
        lang: bash
        code:
          - "curl -s https://api.example.internal/releases/latest"
          - "dg deploy --service billing-worker --rev $REV"
          - "curl -s -f https://api.example.internal/healthz"

      - type: paragraph
        text: "Deploy health status:"

      - type: badge
        tone: success
        text: healthy

      - type: kv
        items:
          - { key: Service, value: billing-worker }
          - { key: Revision, value: f3a9c21 }
          - { key: Region, value: eu-west-1 }
          - { key: Owner, value: Platform </team> }

      - type: details
        summary: Rollback checklist
        content:
          - type: list
            items:
              - Verify the rollback target is a known-good release
              - Freeze deploys for the service before starting
          - type: callout
            tone: warning
            text: The rollback check is never skipped.

      - type: tabs
        active: 1
        tabs:
          - label: Dashboards
            content:
              - type: paragraph
                text: A read-only internal dashboard generated from a single YAML file.
              - type: link
                label: Open the dashboard
                href: "#s-overview"
          - label: Alerts
            content:
              - type: kv
                items:
                  - { key: Channel, value: "#ops-alerts" }
                  - { key: Severity, value: P1 }
          - label: None selected
            text: No default tab opens

      - type: stat-list
        caption: Release health checks
        items:
          - { label: Builds, value: 214, delta: { value: 5, tone: good } }
          - { label: Deploys / day, value: 12, delta: -1 }
          - label: Rollbacks
            value: 0
            delta: { value: 0, tone: neutral }
          - { label: Open incidents, prefix: "#", value: 2, delta: { value: 1, tone: bad } }

      - type: sparkline
        title: Billing-queue lag
        data:
          - [09:14, 1200]
          - [09:17, 860]
          - [09:32, 410]
          - [09:41, 90]
          - [10:05, 0]
        caption: Queue depth in the incident window

      - type: timeline
        title: Incident timeline
        items:
          - { time: "09:14", text: Alert fires on elevated billing-queue lag }
          - { time: "09:17", text: On-call acknowledges and pages the owner }
          - { time: "09:32", text: Rollback of billing-worker released }
          - { time: "09:41", text: Healthz green; queue drains to zero }
          - { time: "10:05", text: Incident window closed }

      - type: def-list
        items:
          - { key: Window, value: "2026-11-17 09:14–10:05" }
          - { key: Root cause, value: Billing-worker release 2144 regression }
          - { key: Action, value: Rolled back; canary at 100% for 30 minutes }

      - type: checklist
        items:
          - { text: Billing-queue drained, done: true }
          - { text: Healthz green after rollback, done: true }
          - { text: Canary at 100% for 30 minutes, done: true }
          - On-call notified of the incident window
          - Post-incident review scheduled

      - type: image
        file: ops-console.svg
        caption: Ops Console status strip

      - type: footnote
        text: Incident windows and datapoints above are illustrative; the rollback
          checklist reflects the internal runbook as of this revision.
